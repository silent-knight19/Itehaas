name: security
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install
      - name: pnpm audit --prod critical
        run: pnpm audit --prod --audit-level=critical
      - name: cargo audit (if available)
        run: |
          if command -v cargo-audit >/dev/null 2>&1; then cargo audit; else echo "cargo-audit not installed, skipping"; fi
      - name: gitleaks detect
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy image (server)
        if: false # manual, needs docker build
        run: echo "trivy image itehaas-server --severity CRITICAL"
