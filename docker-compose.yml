# Phase 10: Full stack — Postgres + Fastify + Next.js
# Bare-metal: brew postgresql@16 + cargo run + pnpm dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itehaas
      POSTGRES_USER: itehaas
      # S1-fresh: fail-closed — no default password baked into git. Set POSTGRES_PASSWORD in .env (24+ random chars).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (24+ random chars, e.g. openssl rand -base64 32)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # S17: least privilege for the database container. Default user is kept
    # deliberately: the postgres entrypoint starts as root to prepare $PGDATA on
    # first boot (chown/initdb) and drops to the postgres user itself; forcing a
    # non-root user or dropping CHOWN/DAC_OVERRIDE breaks fresh-volume init.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # S17: memory bound + log rotation (disk-fill guard) + restart policy.
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itehaas -d itehaas"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # S1-fresh: fail-closed — all secrets mandatory, no insecure fallbacks in git.
      # Copy server/.env.example to .env and fill strong values before `docker compose up`.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env (e.g. postgres://itehaas:<strong-12+char-pwd>@db:5432/itehaas)}
      REPOS_ROOT: /data/repos
      ITEHAAS_BIN: /usr/local/bin/itehaas
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set in .env (32+ random chars, distinct from SECRET_ENCRYPTION_KEY)}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY must be set in .env (32+ random chars, distinct from COOKIE_SECRET)}
      HOST: ${HOST:-127.0.0.1}
      NODE_ENV: ${NODE_ENV:-production}
      # S8 opt-in least privilege (011_db_roles.sql runbook): after creating a password
      # for the itehaas_app role out-of-band, uncomment to run the API as DML-only.
      # DATABASE_APP_URL: ${DATABASE_APP_URL:-}
    volumes:
      - ./data/repos:/data/repos
      # SEC-026: Host binary mount removed — itehaas binary is compiled in multi-stage Dockerfile for target architecture
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["node", "dist/index.js"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # S17: memory bound + log rotation + restart policy (self-hosted profile).
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INTERNAL_API_URL: http://server:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - server
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # S17: memory bound + log rotation + restart policy (self-hosted profile).
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # CI Runner (Phase 9) — optional, Docker-isolated
  # SECURITY: NEVER MOUNT /var/run/docker.sock - host root if mounted to untrusted runner (SEC-009)
  # runner:
  #   build: ./runner
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock  # NEVER - host root
  #   depends_on:
  #     - db

volumes:
  pgdata:
